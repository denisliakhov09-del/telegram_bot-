<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Winner's Circle — Mines Demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">WINNER'S <span>CIRCLE</span></div>
        <div class="subtitle">MINES DEMO</div>
      </div>
      <div class="balance">
        <span>Balance</span>
        <strong id="balance">100.00 €</strong>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="status" id="status">Choose your bet and start</div>
        <div class="controls">
          <label>
            Bet
            <div class="input-wrap">
              <button class="mini" id="minus">−</button>
              <input id="bet" type="number" min="0.10" step="0.10" value="1.00">
              <button class="mini" id="plus">+</button>
            </div>
          </label>
          <label>
            Mines
            <select id="mineCount">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
              <option value="15">15</option>
            </select>
          </label>
        </div>
        <button class="start" id="start">START GAME</button>
      </section>

      <section class="game-card">
        <div class="multiplier">
          <span>Current win</span>
          <strong id="win">0.00 €</strong>
          <small id="mult">×0.00</small>
        </div>
        <div class="grid" id="grid"></div>
        <button class="cashout" id="cashout" disabled>CASH OUT <span id="cashoutAmount">0.00 €</span></button>
      </section>

      <section class="info-row">
        <div><span>Safe</span><b id="safe">0</b></div>
        <div><span>Remaining</span><b id="remaining">25</b></div>
        <div><span>Next</span><b id="nextMult">×1.00</b></div>
      </section>

      <section class="demo-note">
        <b>Demo mode</b>
        <p>This prototype uses virtual credits only. No deposits, withdrawals or real-money wagering are implemented.</p>
      </section>
    </main>

    <footer>
      <button data-tab="game" class="tab active">Game</button>
      <button data-tab="history" class="tab">History</button>
      <button data-tab="profile" class="tab">Profile</button>
    </footer>

    <div class="toast" id="toast"></div>
  </div>
<script src="app.js"></script>
</body>
</html>
