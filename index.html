<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>1win Mines Signal Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
--bg-color: #0b1120;
--card-bg: #1e293b;
--accent-blue: #0284c7;
--accent-green: #22c55e;
--text-main: #f8fafc;
--tile-bg: #334155;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
user-select: none;
-webkit-user-select: none;
-webkit-tap-highlight-color: transparent;
}

html, body {
width: 100%;
height: 100%;
background-color: var(--bg-color);
color: var(--text-main);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow: hidden;
}

/* 1win Partner Badge */
.brand-badge {
position: fixed;
top: 12px;
left: 12px;
background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
color: #ffffff;
font-size: 11px;
font-weight: 800;
padding: 6px 12px;
border-radius: 20px;
box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
display: flex;
align-items: center;
gap: 6px;
z-index: 100;
text-decoration: none;
letter-spacing: 0.5px;
}

.brand-badge span {
background: #ffffff;
color: #0284c7;
padding: 2px 5px;
border-radius: 4px;
font-size: 9px;
}

.container {
width: 90%;
max-width: 360px;
display: flex;
flex-direction: column;
align-items: center;
gap: 14px;
margin: auto;
}

.status-box {
background: var(--card-bg);
border-radius: 12px;
padding: 12px 16px;
width: 100%;
text-align: center;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
border: 1px solid rgba(255, 255, 255, 0.08);
}

.status-text {
font-size: 14px;
font-weight: 800;
color: #38bdf8;
letter-spacing: 0.5px;
text-transform: uppercase;
}

.mines-grid {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 8px;
width: 100%;
aspect-ratio: 1;
background: var(--card-bg);
padding: 12px;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
border: 1px solid rgba(255, 255, 255, 0.05);
}

.tile {
width: 100%;
height: 100%;
background: var(--tile-bg);
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 12px;
color: #ffffff;
border: 1px solid rgba(255, 255, 255, 0.05);
transition: all 0.2s ease;
}

/* Загорающиеся открытые ячейки */
.tile.active-star {
background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%) !important;
box-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
transform: scale(1.04);
animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes pop {
0% { transform: scale(0.6); }
100% { transform: scale(1.04); }
}

.:
/* ЯРКАЯ СИНЯЯ КНОПКА (Всегда видна и кликабельна) */
.btn-get {
width: 100%;
background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%) !important;
color: #ffffff !important;
font-weight: 800;
font-size: 16px;
border: none;
padding: 16px;
border-radius: 14px;
cursor: pointer;
box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
letter-spacing: 0.5px;
text-transform: uppercase;
-webkit-appearance: none;
appearance: none;
}

.btn-get:active {
transform: scale(0.96);
opacity: 0.9;
}
</style>
</head>
<body>

<a class="brand-badge" href="#">
<span>OFFICIAL</span> 1WIN ALGORITHM
</a>

<div class="container">
<div class="status-box">
<span class="status-text" id="status">ГОТОВ К АНАЛИЗУ</span>
</div>

<div class="mines-grid" id="grid">
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
</div>

<button class="btn-get" id="btn-signal">ПОЛУЧИТЬ СИГНАЛ</button>
</div>

<script>
const multipliers = ['x1.24', 'x1.48', 'x1.85', 'x2.22', 'x2.96', 'x3.70', 'x4.45'];
let running = false;

// Telegram WebApp
if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}

function triggerVibration() {
if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
}
}

function startSignalGeneration() {
if (running) return;
running = true;
triggerVibration();

const status = document.getElementById('status');
const tiles = document.querySelectorAll('.tile');

status.style.color = '#38bdf8';
status.innerText = 'АНАЛИЗ АЛГОРИТМА...';

// Очистка всех ячеек
tiles.forEach(t => {
t.className = 'tile';
t.innerText = '';
t.style.background = 'var(--tile-bg)';
});

// Эффект подсвечивания при сканировании
let step = 0;
const timer = setInterval(() => {
let r = Math.floor(Math.random() * 25);
tiles.forEach(t => t.style.background = 'var(--tile-bg)');
if (tiles[r]) {
tiles[r].style.background = '#0284c7';
}
step++;

if (step > 10) {
clearInterval(timer);
showFinalSignal();
}
}, 80);
}

function showFinalSignal() {
const status = document.getElementById('status');
const tiles = document.querySelectorAll('.tile');

tiles.forEach(t => t.style.background = 'var(--tile-bg)');

let count = Math.floor(Math.random() * 3) + 3; // от 3 до 5 звезд
let selected = [];

while (selected.length < count) {
let rand = Math.floor(Math.random() * 25);
if (!selected.includes(rand)) selected.push(rand);
}

selected.forEach((idx, i) => {
setTimeout(() => {

.:
if (tiles[idx]) {
tiles[idx].classList.add('active-star');
tiles[idx].innerText = multipliers[i % multipliers.length];
triggerVibration();
}
}, i * 150);
});

setTimeout(() => {
status.style.color = '#22c55e';
status.innerText = СИГНАЛ СФОРМИРОВАН (${count} ЯЧЕЙКИ);
running = false;
}, count * 150 + 200);
}

// Привязка событий клика и тапа
const btn = document.getElementById('btn-signal');
btn.addEventListener('click', startSignalGeneration);
btn.addEventListener('touchstart', function(e) {
e.preventDefault();
startSignalGeneration();
});
</script>
</body>
</html>
