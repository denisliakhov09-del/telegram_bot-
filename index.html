<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Winner's Circle — Mines</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--accent-green: #22c55e;
--text-main: #f8fafc;
--text-sub: #94a3b8;
--tile-bg: #334155;
--tile-hover: #475569;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
user-select: none;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding: 16px;
}

.header {
text-align: center;
margin-bottom: 20px;
}

.header h1 {
font-size: 20px;
font-weight: 800;
letter-spacing: 1px;
color: #38bdf8;
text-transform: uppercase;
}

.header p {
font-size: 12px;
color: var(--text-sub);
margin-top: 2px;
}

.card {
background: var(--card-bg);
border-radius: 16px;
padding: 16px;
width: 100%;
max-width: 400px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
margin-bottom: 16px;
}

.balance-box {
display: flex;
justify-content: space-between;
align-items: center;
background: rgba(0, 0, 0, 0.2);
padding: 12px 16px;
border-radius: 12px;
margin-bottom: 16px;
}

.balance-label {
font-size: 13px;
color: var(--text-sub);
}

.balance-value {
font-size: 18px;
font-weight: 700;
color: var(--accent-green);
}

.controls-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin-bottom: 16px;
}

.input-group {
display: flex;
flex-direction: column;
gap: 6px;
}

.input-group label {
font-size: 12px;
color: var(--text-sub);
}

.input-group input, .input-group select {
background: var(--tile-bg);
border: 1px solid #475569;
color: #fff;
padding: 10px;
border-radius: 8px;
font-size: 14px;
font-weight: 600;
outline: none;
}

.btn-start {
width: 100%;
background: var(--accent-green);
color: #000;
font-weight: 700;
font-size: 16px;
border: none;
padding: 14px;
border-radius: 12px;
cursor: pointer;
box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
}

.mines-grid {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 8px;
margin-top: 16px;
}

.tile {
aspect-ratio: 1;
background: var(--tile-bg);
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
font-size: 18px;
cursor: pointer;
}

.nav-tabs {
display: flex;
gap: 8px;
width: 100%;
max-width: 400px;
}

.tab-btn {
flex: 1;
background: var(--card-bg);
border: none;
color: var(--text-sub);
padding: 10px;

.:
border-radius: 10px;
font-size: 13px;
font-weight: 600;
}

.tab-btn.active {
background: #334155;
color: var(--text-main);
}
</style>
</head>
<body>

<div class="header">
<h1>WINNER'S CIRCLE</h1>
<p>MINES DEMO</p>
</div>

<div class="card">
<div class="balance-box">
<span class="balance-label">Баланс</span>
<span class="balance-value">100.00 €</span>
</div>

<div class="controls-grid">
<div class="input-group">
<label>Ставка (€)</label>
<input type="number" value="1.00" step="0.5">
</div>
<div class="input-group">
<label>Мины</label>
<select>
<option>3</option>
<option selected>5</option>
<option>10</option>
</select>
</div>
</div>

<button class="btn-start">НАЧАТЬ ИГРУ</button>

<div class="mines-grid">
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
</div>
</div>

<div class="nav-tabs">
<button class="tab-btn active">Игра</button>
<button class="tab-btn">История</button>
<button class="tab-btn">Профиль</button>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}
</script>
</body>.
