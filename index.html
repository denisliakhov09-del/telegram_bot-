<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1win Mines Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
--bg-color: #0b1120;
--card-bg: #1e293b;
--accent-blue: #0284c7;
--accent-green: #22c55e;
--text-main: #f8fafc;
--text-sub: #94a3b8;
--tile-bg: #334155;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
user-select: none;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 16px;
}

.brand-badge {
position: fixed;
top: 12px;
left: 12px;
background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
color: #fff;
font-size: 11px;
font-weight: 800;
padding: 6px 12px;
border-radius: 20px;
box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
display: flex;
align-items: center;
gap: 6px;
z-index: 100;
text-decoration: none;
letter-spacing: 0.5px;
}

.brand-badge span {
background: #fff;
color: #0284c7;
padding: 2px 5px;
border-radius: 4px;
font-size: 9px;
}

.container {
width: 100%;
max-width: 380px;
display: flex;
flex-direction: column;
align-items: center;
gap: 16px;
}

.status-box {
background: var(--card-bg);
border-radius: 12px;
padding: 14px 20px;
width: 100%;
text-align: center;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
border: 1px solid rgba(255, 255, 255, 0.05);
}

.status-text {
font-size: 14px;
font-weight: 700;
color: #38bdf8;
letter-spacing: 0.5px;
}

.mines-grid {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 8px;
width: 100%;
background: var(--card-bg);
padding: 12px;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.tile {
aspect-ratio: 1;
background: var(--tile-bg);
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 13px;
transition: all 0.2s ease;
color: #fff;
border: 1px solid rgba(255, 255, 255, 0.05);
}

.tile.active-star {
background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%) !important;
box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
transform: scale(1.05);
}

.btn-get {
width: 100%;
background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
color: #fff;
font-weight: 800;
font-size: 16px;
border: none;
padding: 16px;
border-radius: 14px;
cursor: pointer;
box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
transition: transform 0.1s, opacity 0.2s;
letter-spacing: 0.5px;
}

.btn-get:active {
transform: scale(0.96);
}

.btn-get:disabled {

.:
opacity: 0.5;
cursor: not-allowed;
}
</style>
</head>
<body>

<a class="brand-badge" href="#">
<span>OFFICIAL</span> 1WIN ALGORITHM
</a>

<div class="container">
<div class="status-box">
<span class="status-text" id="status">ГОТОВ К АНАЛИЗУ</span>
</div>

<div class="mines-grid" id="grid"></div>

<button class="btn-get" id="btn-signal" onclick="runSignalAlgorithm()">ПОЛУЧИТЬ СИГНАЛ</button>
</div>

<script>
const multipliers = ['x1.20', 'x1.45', 'x1.80', 'x2.10', 'x2.50', 'x3.20', 'x4.00'];
let busy = false;

function renderGrid() {
const grid = document.getElementById('grid');
grid.innerHTML = '';
for (let i = 0; i < 25; i++) {
const tile = document.createElement('div');
tile.className = 'tile';
grid.appendChild(tile);
}
}

function runSignalAlgorithm() {
if (busy) return;
busy = true;

const btn = document.getElementById('btn-signal');
const status = document.getElementById('status');
const tiles = document.querySelectorAll('.tile');

btn.disabled = true;
status.innerText = 'АНАЛИЗ АЛГОРИТМА...';

// Очистка ячеек
tiles.forEach(t => {
t.className = 'tile';
t.innerText = '';
t.style.background = 'var(--tile-bg)';
});

// Эффект анализа
let steps = 0;
const timer = setInterval(() => {
let randomIdx = Math.floor(Math.random() * 25);
tiles.forEach(t => t.style.background = 'var(--tile-bg)');
if (tiles[randomIdx]) {
tiles[randomIdx].style.background = '#0284c7';
}
steps++;

if (steps > 10) {
clearInterval(timer);
finishSignal();
}
}, 80);
}

function finishSignal() {
const btn = document.getElementById('btn-signal');
const status = document.getElementById('status');
const tiles = document.querySelectorAll('.tile');

tiles.forEach(t => t.style.background = 'var(--tile-bg)');

let count = Math.floor(Math.random() * 3) + 3; // 3-5 ячеек
let picked = [];

while (picked.length < count) {
let r = Math.floor(Math.random() * 25);
if (!picked.includes(r)) picked.push(r);
}

picked.forEach((idx, i) => {
setTimeout(() => {
if (tiles[idx]) {
tiles[idx].classList.add('active-star');
tiles[idx].innerText = multipliers[i % multipliers.length];
}
}, i * 120);
});

setTimeout(() => {
status.innerText = СИГНАЛ СФОРМИРОВАН (${count} ЯЧЕЙКИ);
btn.disabled = false;
busy = false;
}, count * 120 + 150);
}

// Инициализация при старте
window.addEventListener('DOMContentLoaded', () => {
if (window.Telegram && window.Telegram.WebApp) {
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}
renderGrid();
});
</script>
</body>
</html>
