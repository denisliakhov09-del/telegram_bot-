<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1win Mines Algorithm Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
--bg-color: #0b1120;
--card-bg: #1e293b;
--accent-blue: #0284c7;
--accent-green: #22c55e;
--text-main: #f8fafc;
--text-sub: #94a3b8;
--tile-bg: #334155;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
user-select: none;
-webkit-user-select: none;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 16px;
overflow: hidden;
}

/* 1win Partner Badge */
.brand-badge {
position: fixed;
top: 12px;
left: 12px;
background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
color: #fff;
font-size: 11px;
font-weight: 800;
padding: 6px 12px;
border-radius: 20px;
box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
display: flex;
align-items: center;
gap: 6px;
z-index: 100;
text-decoration: none;
letter-spacing: 0.5px;
}

.brand-badge span {
background: #fff;
color: #0284c7;
padding: 2px 5px;
border-radius: 4px;
font-size: 9px;
}

.container {
width: 100%;
max-width: 380px;
display: flex;
flex-direction: column;
align-items: center;
gap: 16px;
}

.status-box {
background: var(--card-bg);
border-radius: 12px;
padding: 14px 20px;
width: 100%;
text-align: center;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
border: 1px solid rgba(255, 255, 255, 0.05);
}

.status-text {
font-size: 14px;
font-weight: 700;
color: #38bdf8;
letter-spacing: 0.5px;
transition: color 0.2s;
}

.mines-grid {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 8px;
width: 100%;
background: var(--card-bg);
padding: 12px;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
min-height: 280px;
}

.tile {
aspect-ratio: 1;
background: var(--tile-bg);
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 13px;
transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
color: #fff;
border: 1px solid rgba(255, 255, 255, 0.05);
}

.tile.active-star {
background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%) !important;
box-shadow: 0 0 15px rgba(34, 197, 94, 0.7);
transform: scale(1.05);
animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes pop {
0% { transform: scale(0.6); }
100% { transform: scale(1.05); }
}

.btn-get {
width: 100%;

.:
background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
color: #fff;
font-weight: 800;
font-size: 16px;
border: none;
padding: 16px;
border-radius: 14px;
cursor: pointer;
box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
transition: transform 0.1s, opacity 0.2s;
letter-spacing: 0.5px;
outline: none;
}

.btn-get:active {
transform: scale(0.96);
}

.btn-get:disabled {
opacity: 0.5;
cursor: not-allowed;
transform: none;
}
</style>
</head>
<body>

<!-- 1win Partner Badge -->
<a class="brand-badge" href="#" onclick="triggerHaptic()">
<span>OFFICIAL</span> 1WIN ALGORITHM
</a>

<div class="container">
<div class="status-box">
<span class="status-text" id="status">ГОТОВ К АНАЛИЗУ</span>
</div>

<!-- 25 ячеек в разметке -->
<div class="mines-grid" id="grid">
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
</div>

<button class="btn-get" id="btn-signal">ПОЛУЧИТЬ СИГНАЛ</button>
</div>

<script>
const multipliers = ['x1.20', 'x1.45', 'x1.80', 'x2.10', 'x2.50', 'x3.20', 'x4.00'];
let isProcessing = false;

// Telegram WebApp Init
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
tg.ready();
tg.expand();
}

function triggerHaptic(type = 'impact', style = 'medium') {
if (tg && tg.HapticFeedback) {
if (type === 'impact') tg.HapticFeedback.impactOccurred(style);
if (type === 'notification') tg.HapticFeedback.notificationOccurred(style);
}
}

function ensureGrid() {
const grid = document.getElementById('grid');
if (!grid) return;
if (grid.children.length !== 25) {
grid.innerHTML = '';
for (let i = 0; i < 25; i++) {
const tile = document.createElement('div');
tile.className = 'tile';
grid.appendChild(tile);
}
}
}

function executeSignal() {
if (isProcessing) return;
isProcessing = true;
triggerHaptic('impact', 'medium');

ensureGrid();

const btn = document.getElementById('btn-signal');
const status = document.getElementById('status');
const tiles = document.querySelectorAll('.tile');

btn.disabled = true;
status.style.color = '#38bdf8';
status.innerText = 'АНАЛИЗ АЛГОРИТМА...';

// Полная очистка состояния
tiles.forEach(t => {
t.className = 'tile';
t.innerText = '';
t.style.background = 'var(--tile-bg)';
});

let steps = 0;
const scanInterval = setInterval(() => {
try {
let randIndex = Math.floor(Math.random() * 25);
tiles.forEach(t => t.style.background = 'var(--tile-bg)');
if (tiles[randIndex]) {
tiles[randIndex].style.background = '#0284c7';
}
steps++;

if (steps > 12) {

.:
clearInterval(scanInterval);
renderResults();
}
} catch (e) {
clearInterval(scanInterval);
resetState();
}
}, 70);
}

function renderResults() {
const btn = document.getElementById('btn-signal');
const status = document.getElementById('status');
const tiles = document.querySelectorAll('.tile');

tiles.forEach(t => t.style.background = 'var(--tile-bg)');

let count = Math.floor(Math.random() * 3) + 3; // От 3 до 5 сигналов
let selectedIndexes = [];

while (selectedIndexes.length < count) {
let r = Math.floor(Math.random() * 25);
if (!selectedIndexes.includes(r)) selectedIndexes.push(r);
}

selectedIndexes.forEach((idx, i) => {
setTimeout(() => {
if (tiles[idx]) {
tiles[idx].classList.add('active-star');
tiles[idx].innerText = multipliers[i % multipliers.length];
triggerHaptic('impact', 'light');
}
}, i * 140);
});

setTimeout(() => {
status.style.color = '#22c55e';
status.innerText = СИГНАЛ СФОРМИРОВАН (${count} ЯЧЕЙКИ);
triggerHaptic('notification', 'success');
btn.disabled = false;
isProcessing = false;
}, count * 140 + 200);
}

function resetState() {
const btn = document.getElementById('btn-signal');
const status = document.getElementById('status');
status.innerText = 'ГОТОВ К АНАЛИЗУ';
btn.disabled = false;
isProcessing = false;
}

// Единственная надежная точка привязки кликов
function initListeners() {
ensureGrid();
const btn = document.getElementById('btn-signal');
if (btn) {
btn.removeEventListener('click', executeSignal);
btn.addEventListener('click', executeSignal);
}
}

if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', initListeners);
} else {
initListeners();
}
window.onload = initListeners;
</script>
</body>
</html>
